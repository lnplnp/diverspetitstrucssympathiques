<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Constante de Kaprekar</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Constante de Kaprekar</h1>
        <p>Choisissez le nombre de chiffres et entrez un nombre pour découvrir sa constante de Kaprekar.</p>
        
        <div class="input-group">
            <label for="digitCount">Nombre de chiffres (n) :</label>
            <select id="digitCount">
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4" selected>4</option>
                <option value="5">5</option>
                <option value="6">6</option>
                <option value="7">7</option>
                <option value="8">8</option>
                <option value="9">9</option>
                <option value="10">10</option>
            </select>
        </div>
        
        <input type="text" id="numberInput" placeholder="Ex: 1000, 3524" inputmode="numeric" pattern="[0-9]*">
        <button onclick="calculateKaprekar()">Calculer</button>
        
        <div id="result"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
